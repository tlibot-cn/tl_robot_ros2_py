# 天链机器人 Python 代码格式化配置
#
# git 提交时会自动运行 black 格式化（.githooks/pre-commit）
# 手动格式化: black .
# 仅检查格式: black --check .

# ── Black: Python 代码格式化 ──────────────────
[tool.black]
line-length = 100
target-version = ["py39", "py310"]
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.nox
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

# ── pytest ─────────────────────────────────────
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["src"]
python_files = ["test_*.py", "*_test.py"]
